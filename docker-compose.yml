services:
  backend1:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "5001:5000"

  backend2:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "5002:5000"

  backend3:
    build: ./backend
    env_file: ./backend/.env
    ports:
      - "5003:5000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
